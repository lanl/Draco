#--------------------------------------------------------------------------------------------------#
# Machine-wide default job settings
#--------------------------------------------------------------------------------------------------#

---
.darwin:
  extends: .jacamar
  tags:
    - darwin-slurm-shared
  variables:
    ARCH: x86_64
    SITE_ID: darwin
    CTEST_SITE: ${SITE_ID}
    EXTRA_CMAKE_ARGS: -G Ninja
    SP_volta_x86: "--nodes=1 --partition=volta-x86 --qos=debug --constraint='cpu_family:broadwell|\
                  cpu_family:haswell'"
    SP_x86_64: "--nodes=1 --partition=general --qos=debug --constraint='cpu_family:broadwell|\
               cpu_family:haswell|cpu_family:skylake|cpu_family:cascadelake'"
    SP_ampere: "--nodes=1 --partition=shared-gpu-ampere --qos=debug"
    # CI_DEBUG_TRACE: "true"

#--------------------------------------------------------------------------------------------------#
# MRs - linters
#--------------------------------------------------------------------------------------------------#

darwin_clangtidy:
  extends: .darwin
  stage: lint
  allow_failure: true
  variables:
    CMAKE_BUILD_TYPE: Debug
    DRACO_ENV: draco/haswell-llvm1706-c
    SCHEDULER_PARAMETERS: ${SP_${ARCH}}
    EXTRA_CMAKE_ARGS: -DDRACO_STATIC_ANALYZER=clang-tidy
    EXTRA_CTEST_ARGS: -R dsxx_tstRelease
  script:
    # Run everything under a bash shell.
    # Echo output to the screen and capture output to a file.
    # If the build command fails, report it and exit with an error code.
    # If clang-tidy warnings are found, fail the pipeline and save the log as an artifact.
    # Use grep -vE to ignore some warnings.
    - /bin/bash -l -c '
      LOG=clang-tidy-out.txt;
      ${CI_PROJECT_DIR}/.gitlab/ci/gitlab-ci-run-tests.sh 2>&1 | tee ${LOG};
      num_warnings=$(grep -nE "(^|[[:space:]])warning:" "$LOG"
        | grep -cvE "j0 forced in submake|some_known_one");
      if [[ $num_warnings -gt 0 ]]; then
        echo "==> Found $num_warnings lint warnings from clang-tidy; Pipeline failed.";
        echo "==> See attached artifact $LOG for more details.";
        exit 1;
      fi;
      echo "==> Clang-tidy lint check was successful!"
      '
  artifacts:
    paths: [clang-tidy-out.txt]
    when: on_failure
    expire_in: 7d
  rules:
    - if: '$CI_MERGE_REQUEST_LABELS =~ /exclude_darwin/'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

darwin_style_cxx:
  stage: lint
  extends: .darwin
  variables:
    CMAKE_BUILD_TYPE: Release
    DRACO_ENV: draco/haswell-gcc850
    CTEST_NPROC: 32
    MAXLOAD: 32
    ARCH: x86_64
    SCHEDULER_PARAMETERS: ${SP_${ARCH}}
  script:
    - /bin/bash -l -c "${CI_PROJECT_DIR}/.gitlab/ci/gitlab-ci-style-checks.sh"
  rules:
    - if: '$CI_MERGE_REQUEST_LABELS =~ /exclude_darwin/'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "pipeline"'

#--------------------------------------------------------------------------------------------------#
# Deployment Jobs (run on develop after MRs are merged)
#--------------------------------------------------------------------------------------------------#

.darwin_deploy:
  extends: .darwin
  stage: deploy
  allow_failure: true
  variables:
    DEPLOY: 'TRUE'
    FLAVOR: ${DRACO_ENV}-${CMAKE_BUILD_TYPE}
    DRACO_INSTALL_DIR: "/projects/draco/deploy/${FLAVOR}"
  script:
    - /bin/bash -l -c "${CI_PROJECT_DIR}/.gitlab/ci/gitlab-ci-run-tests.sh"
  rules:
    # Don't deploy if this is a forked repository.
    - if: '$CI_PROJECT_NAMESPACE != "draco"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_PIPELINE_SOURCE == "web"'

darwin_deploy_clangtidy:
  extends: .darwin_deploy
  variables:
    CMAKE_BUILD_TYPE: Debug
    DRACO_ENV: draco/haswell-llvm1706-c
    SCHEDULER_PARAMETERS: ${SP_${ARCH}}
    FLAVOR: ${DRACO_ENV}-${CMAKE_BUILD_TYPE}-clang-tidy
    EXTRA_CMAKE_ARGS: -G Ninja -DDRACO_STATIC_ANALYZER=clang-tidy

darwin_deploy_debug_llvm:
  extends: .darwin_deploy
  variables:
    CMAKE_BUILD_TYPE: Debug
    DRACO_ENV: draco/haswell-llvm1706-c
    SCHEDULER_PARAMETERS: ${SP_${ARCH}}

darwin_deploy_release_llvm:
  extends: .darwin_deploy
  variables:
    CMAKE_BUILD_TYPE: Release
    DRACO_ENV: draco/haswell-llvm1706-c
    SCHEDULER_PARAMETERS: ${SP_${ARCH}}

darwin_deploy_debug_gcc_volta_x86:
  extends: .darwin_deploy
  variables:
    ARCH: volta_x86
    CMAKE_BUILD_TYPE: Debug
    DRACO_ENV: draco/haswell-gcc1120
    FLAVOR: ${DRACO_ENV}-${CMAKE_BUILD_TYPE}-${ARCH}
    SCHEDULER_PARAMETERS: ${SP_${ARCH}}

#--------------------------------------------------------------------------------------------------#
# Deploy a versioned release (dvr)
#--------------------------------------------------------------------------------------------------#

.darwin_dvr:
  extends: .darwin
  stage: deploy
  allow_failure: true
  variables:
    DEPLOY: 'TRUE'
    DEPLOY_RELEASE: 'TRUE'
    FLAVOR: ${DRACO_ENV}-${CMAKE_BUILD_TYPE}
    DRACO_INSTALL_DIR: "/usr/projects/draco/${CI_COMMIT_TAG}${CI_COMMIT_BRANCH}/${FLAVOR}"
  script:
    - echo "branch = $CI_COMMIT_BRANCH, tag = $CI_COMMIT_TAG"
    - echo "Starting dx64_deploy_release..."
    - if [[ -z ${CI_COMMIT_BRANCH} ]]; then
        VERSION_PATCH=${CI_COMMIT_TAG//*_/};
      else
        VERSION_PATCH=${CI_COMMIT_BRANCH//*_/};
      fi
    - EXTRA_CMAKE_ARGS="${EXTRA_CMAKE_ARGS} -DDraco_VERSION_PATCH=${VERSION_PATCH}"
    - /bin/bash -l -c "${CI_PROJECT_DIR}/.gitlab/ci/gitlab-ci-run-tests.sh"
  rules:
    # Don't deploy if this is a forked repository.
    - if: '$CI_PROJECT_NAMESPACE != "draco"'
      when: never
    - if: '$CI_COMMIT_BRANCH =~ /^draco-[0-9]+(?:_[0-9]+)+$/'
    - if: '$CI_COMMIT_TAG =~ /^draco-[0-9]+(?:_[0-9]+)+$/'
    - if: '$CI_PIPELINE_SOURCE == "web"'

darwin_dvr_debug_llvm:
  extends: .darwin_dvr
  variables:
    CMAKE_BUILD_TYPE: Debug
    DRACO_ENV: draco/haswell-llvm1706-c
    SCHEDULER_PARAMETERS: ${SP_${ARCH}}

darwin_dvr_release_llvm:
  extends: .darwin_dvr
  variables:
    CMAKE_BUILD_TYPE: Release
    DRACO_ENV: draco/haswell-llvm1706-c
    SCHEDULER_PARAMETERS: ${SP_${ARCH}}

darwin_dvr_debug_gcc_volta_x86:
  extends: .darwin_dvr
  variables:
    ARCH: volta_x86
    CMAKE_BUILD_TYPE: Debug
    DRACO_ENV: draco/haswell-gcc1120
    FLAVOR: ${DRACO_ENV}-${CMAKE_BUILD_TYPE}-${ARCH}
    SCHEDULER_PARAMETERS: ${SP_${ARCH}}

#--------------------------------------------------------------------------------------------------#
# Merge Requests
#--------------------------------------------------------------------------------------------------#

.darwin_merge:
  extends: .darwin
  script:
    - /bin/bash -l -c "${CI_PROJECT_DIR}/.gitlab/ci/gitlab-ci-run-tests.sh"
  rules:
    - if: '$CI_MERGE_REQUEST_LABELS =~ /exclude_darwin/'
      when: never
    - if: '$CI_MERGE_REQUEST_TITLE =~ /Draft:/ || $CI_MERGE_REQUEST_TITLE =~ /WIP:/'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "pipeline"'

darwin_debug_llvm_mr:
  stage: test
  extends: .darwin_merge
  variables:
    CMAKE_BUILD_TYPE: Debug
    DRACO_ENV: draco/haswell-llvm1706-c
    ARCH: x86_64
    SCHEDULER_PARAMETERS: ${SP_${ARCH}}

darwin_debug_llvm_mr:
  stage: slowtest
  extends: .darwin_merge
  variables:
    CMAKE_BUILD_TYPE: Debug
    DRACO_ENV: draco/haswell-llvm1706-c
    ARCH: x86_64
    SCHEDULER_PARAMETERS: ${SP_${ARCH}}

darwin_debug_gcc_volta_x86_mr:
  stage: slowtest
  extends: .darwin_merge
  variables:
    ARCH: volta_x86
    CMAKE_BUILD_TYPE: Debug
    DRACO_ENV: draco/haswell-gcc1120
    SCHEDULER_PARAMETERS: ${SP_${ARCH}}

#--------------------------------------------------------------------------------------------------#
# Nightly Regression
#--------------------------------------------------------------------------------------------------#

.darwin_nightly:
  extends: .darwin
  variables:
    CTEST_MODE: Nightly
    CTEST_BUILD_NAME: ${DRACO_ENV}-${CMAKE_BUILD_TYPE}
    EXTRA_CMAKE_ARGS: -G Ninja
  script:
    - /bin/bash -l -c "${CI_PROJECT_DIR}/.gitlab/ci/gitlab-nightly-regress.sh"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'

darwin_debug_llvm:
  stage: test
  extends: .darwin_nightly
  variables:
    CMAKE_BUILD_TYPE: Debug
    DRACO_ENV: draco/haswell-llvm1706-c
    ARCH: x86_64
    SCHEDULER_PARAMETERS: ${SP_${ARCH}}

darwin_release_llvm:
  stage: test
  extends: .darwin_nightly
  variables:
    CMAKE_BUILD_TYPE: Release
    DRACO_ENV: draco/haswell-llvm1706-c
    ARCH: x86_64
    SCHEDULER_PARAMETERS: ${SP_${ARCH}}

darwin_debug_gcc_volta_x86:
  stage: test
  extends: .darwin_nightly
  variables:
    ARCH: volta_x86
    CMAKE_BUILD_TYPE: Debug
    DRACO_ENV: draco/haswell-gcc1120
    SCHEDULER_PARAMETERS: ${SP_${ARCH}}

darwin_debug_gcc_ampere:
  stage: test
  extends: .darwin_nightly
  variables:
    ARCH: ampere
    CMAKE_BUILD_TYPE: Debug
    DRACO_ENV: draco/rome-ampere
    SCHEDULER_PARAMETERS: ${SP_${ARCH}}

darwin_clangtidy_llvm:
  stage: test
  extends: .darwin_nightly
  variables:
    CMAKE_BUILD_TYPE: Debug
    DRACO_ENV: draco/haswell-llvm1706-c
    ARCH: x86_64
    SCHEDULER_PARAMETERS: ${SP_${ARCH}}
    EXTRA_CMAKE_ARGS: -G Ninja -DDRACO_STATIC_ANALYZER=clang-tidy
    FLAVOR: ${DRACO_ENV}-${CMAKE_BUILD_TYPE}-clang-tidy
    CTEST_BUILD_NAME: clang-tidy

#--------------------------------------------------------------------------------------------------#
# end .gitlab/ci/darwin-jobs.yml
#--------------------------------------------------------------------------------------------------#
