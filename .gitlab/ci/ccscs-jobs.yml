#--------------------------------------------------------------------------------------------------#
# Machine-wide default job settings
#--------------------------------------------------------------------------------------------------#

---
.ccscs:
  extends: .jacamar
  tags:
    - CCSNET-setuid-shared
  variables:
    SITE_ID: ccsnet
  #   CI_DEBUG_TRACE: "true"

#--------------------------------------------------------------------------------------------------#
# Deployment Jobs (run on develop after MRs are merged)
#--------------------------------------------------------------------------------------------------#

.ccscs_deploy:
  extends: .ccscs
  stage: deploy
  variables:
    DEPLOY: 'TRUE'
    FLAVOR: ${DRACO_ENV}-${CMAKE_BUILD_TYPE}
    DRACO_INSTALL_DIR: "/ccs/codes/radtran/regress/deploy/draco/${FLAVOR}"
    EXTRA_CMAKE_ARGS: -G Ninja -DCMAKE_C_FLAGS="-march=broadwell"
      -DCMAKE_Fortran_FLAGS="-march=broadwell" -DUSE_SHACL_PHYSICS=True
  script:
    - /bin/bash -l -c "${CI_PROJECT_DIR}/.gitlab/ci/gitlab-ci-run-tests.sh"
  rules:
    # Don't deploy if this is a forked repository.
    - if: '$CI_PROJECT_NAMESPACE != "draco"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: manual
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_PIPELINE_SOURCE == "web"'

ccs_deb_gcc_cxx23_deploy:
  extends: .ccscs_deploy
  variables:
    CMAKE_BUILD_TYPE: Debug
    DRACO_ENV: draco/gcc1610
    EXTRA_CMAKE_ARGS: -GNinja -DDraco_CXX_LANGUAGE_STANDARD=23 -DCMAKE_C_FLAGS="-march=broadwell"
      -DCMAKE_Fortran_FLAGS="-march=broadwell"
    FLAVOR: ${DRACO_ENV}-${CMAKE_BUILD_TYPE}-cxx23
    # With intel-classic on Roci, we need to add -gcc-name=/opt/cray/pe/gcc/10.3.0/snos/bin/g++

ccs_deploy_rwdi_gcc:
  extends: .ccscs_deploy
  variables:
    CMAKE_BUILD_TYPE: RelWithDebInfo
    DRACO_ENV: draco/gcc1610

ccs_deploy_c4_scalar:
  extends: .ccscs_deploy
  variables:
    CMAKE_BUILD_TYPE: Debug
    DRACO_ENV: draco/gcc1610
    FLAVOR: ${DRACO_ENV}-${CMAKE_BUILD_TYPE}-scalar
    EXTRA_CMAKE_ARGS: -G Ninja -DDRACO_C4=SCALAR -DDRACO_DIAGNOSTICS=2
      -DCMAKE_C_FLAGS="-march=broadwell" -DCMAKE_Fortran_FLAGS="-march=broadwell"

ccs_deploy_deb_gcc:
  extends: .ccscs_deploy
  variables:
    CMAKE_BUILD_TYPE: Debug
    DRACO_ENV: draco/gcc1610

ccs_deploy_rel_gcc:
  extends: .ccscs_deploy
  variables:
    CMAKE_BUILD_TYPE: Release
    DRACO_ENV: draco/gcc1610

ccs_deploy_deb_llvm:
  extends: .ccscs_deploy
  variables:
    CMAKE_BUILD_TYPE: Debug
    DRACO_ENV: draco/llvm2215

ccs_deploy_rel_llvm:
  extends: .ccscs_deploy
  variables:
    CMAKE_BUILD_TYPE: Release
    DRACO_ENV: draco/llvm2215

ccs_deploy_fulldiag:
  extends: .ccscs_deploy
  variables:
    CMAKE_BUILD_TYPE: Debug
    DRACO_ENV: draco/gcc1610
    FLAVOR: ${DRACO_ENV}-${CMAKE_BUILD_TYPE}-fulldiag
    # DRACO_TIMING=1 enables caliper timers.
    # DRACO_DIAGNOSTICS=7 enables FPE traps.
    EXTRA_CMAKE_ARGS: -G Ninja -DDRACO_DIAGNOSTICS=7 -DDRACO_TIMING=1 -DDRACO_LIBRARY_TYPE=STATIC
      -DCMAKE_C_FLAGS="-march=broadwell" -DCMAKE_Fortran_FLAGS="-march=broadwell"

ccs_deploy_gcov:
  extends: .ccscs_deploy
  variables:
    CMAKE_BUILD_TYPE: Debug
    DRACO_ENV: draco/gcc1610
    FLAVOR: ${DRACO_ENV}-${CMAKE_BUILD_TYPE}-gcov
    EXTRA_CMAKE_ARGS: -DCODE_COVERAGE=ON -DCMAKE_C_FLAGS="-march=broadwell"
      -DCMAKE_Fortran_FLAGS="-march=broadwell"

ccs_deploy_valgrind:
  extends: .ccscs_deploy
  variables:
    CMAKE_BUILD_TYPE: Debug
    DRACO_ENV: draco/gcc1610
    FLAVOR: ${DRACO_ENV}-${CMAKE_BUILD_TYPE}-valgrind
    EXTRA_CMAKE_ARGS: -DENABLE_MEMORYCHECK=ON
      -DCTEST_MEMORYCHECK_SUPPRESSIONS_FILE="${CI_PROJECT_DIR}/.gitlab/ci/valgrind_suppress.txt"
        -DCMAKE_C_FLAGS="-march=broadwell" -DCMAKE_Fortran_FLAGS="-march=broadwell"

ccs_deploy_deb_gcc13:
  extends: .ccscs_deploy
  variables:
    CMAKE_BUILD_TYPE: Debug
    DRACO_ENV: draco/gcc1330
    EXTRA_CMAKE_ARGS: -G Ninja -DCMAKE_C_FLAGS="-march=broadwell"
      -DCMAKE_Fortran_FLAGS="-march=broadwell" -DUSE_SHACL_PHYSICS=ON

ccs_deploy_rel_gcc13:
  extends: .ccscs_deploy
  variables:
    CMAKE_BUILD_TYPE: Release
    DRACO_ENV: draco/gcc1330
    EXTRA_CMAKE_ARGS: -G Ninja -DCMAKE_C_FLAGS="-march=broadwell"
      -DCMAKE_Fortran_FLAGS="-march=broadwell" -DUSE_SHACL_PHYSICS=ON

ccscs_deploy_clangtidy:
  extends: .ccscs_deploy
  variables:
    CMAKE_BUILD_TYPE: Debug
    DRACO_ENV: draco/llvm2215
    FLAVOR: ${DRACO_ENV}-${CMAKE_BUILD_TYPE}-clang-tidy
    EXTRA_CMAKE_ARGS: -G Ninja -DCMAKE_C_FLAGS="-march=broadwell"
      -DCMAKE_Fortran_FLAGS="-march=broadwell"
      -DDRACO_STATIC_ANALYZER=clang-tidy

#--------------------------------------------------------------------------------------------------#
# Deploy a versioned release (dvr)
#--------------------------------------------------------------------------------------------------#

.ccscs_dvr:
  extends: .ccscs
  stage: deploy
  variables:
    DEPLOY: 'TRUE'
    DEPLOY_RELEASE: 'TRUE'
    FLAVOR: ${DRACO_ENV}-${CMAKE_BUILD_TYPE}
    DRACO_INSTALL_DIR:
      "/ccs/codes/radtran/regress/deploy/${CI_COMMIT_TAG}${CI_COMMIT_BRANCH}/${FLAVOR}"
    EXTRA_CMAKE_ARGS: -G Ninja -DCMAKE_C_FLAGS="-march=broadwell"
      -DCMAKE_Fortran_FLAGS="-march=broadwell"
  script:
    - echo "branch = $CI_COMMIT_BRANCH, tag = $CI_COMMIT_TAG"
    - echo "Starting ccscs_deploy_release..."
    - if [[ -z ${CI_COMMIT_BRANCH} ]]; then
        VERSION_PATCH=${CI_COMMIT_TAG//*_/};
      else
        VERSION_PATCH=${CI_COMMIT_BRANCH//*_/};
      fi
    - EXTRA_CMAKE_ARGS="${EXTRA_CMAKE_ARGS} -DDraco_VERSION_PATCH=${VERSION_PATCH}"
    - /bin/bash -l -c "${CI_PROJECT_DIR}/.gitlab/ci/gitlab-ci-run-tests.sh"
  rules:
    # Don't deploy if this is a forked repository.
    - if: '$CI_PROJECT_NAMESPACE != "draco"'
      when: never
    - if: '$CI_COMMIT_BRANCH =~ /^draco-[0-9]+(?:_[0-9]+)+$/'
    - if: '$CI_COMMIT_TAG =~ /^draco-[0-9]+(?:_[0-9]+)+$/'
    - if: '$CI_PIPELINE_SOURCE == "web"'

ccs_dvr_deb_gcc:
  extends: .ccscs_dvr
  variables:
    CMAKE_BUILD_TYPE: Debug
    DRACO_ENV: draco/gcc1330

ccs_dvr_rel_gcc:
  extends: .ccscs_dvr
  variables:
    CMAKE_BUILD_TYPE: Release
    DRACO_ENV: draco/gcc1330
    EXTRA_CMAKE_ARGS: -G Ninja -DDRACO_ROUNDOFF_MODE=FAST -DCMAKE_C_FLAGS="-march=broadwell"
      -DCMAKE_Fortran_FLAGS="-march=broadwell"

ccs_dvr_deb_gcc16:
  extends: .ccscs_dvr
  variables:
    CMAKE_BUILD_TYPE: Debug
    DRACO_ENV: draco/gcc1610

ccs_dvr_rel_gcc16:
  extends: .ccscs_dvr
  variables:
    CMAKE_BUILD_TYPE: Release
    DRACO_ENV: draco/gcc1610
    EXTRA_CMAKE_ARGS: -G Ninja -DDRACO_ROUNDOFF_MODE=FAST -DCMAKE_C_FLAGS="-march=broadwell"
      -DCMAKE_Fortran_FLAGS="-march=broadwell"

#--------------------------------------------------------------------------------------------------#
# Merge Requests
#--------------------------------------------------------------------------------------------------#

.ccscs_merge:
  extends: .ccscs
  variables:
    EXTRA_CMAKE_ARGS: -G Ninja
  script:
    - /bin/bash -l -c "${CI_PROJECT_DIR}/.gitlab/ci/gitlab-ci-run-tests.sh"
  artifacts:
    paths:
      - build/ci-env.log
  rules:
    - if: '$CI_MERGE_REQUEST_LABELS =~ /exclude_ccsnet/'
      when: never
    - if: '$CI_MERGE_REQUEST_TITLE =~ /Draft:/ || $CI_MERGE_REQUEST_TITLE =~ /WIP:/'
      when: never
    - if: '$CI_PROJECT_NAMESPACE != "draco"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "pipeline"'

# ---------- fast TEST --------------------------------------------- #

ccs_deb_gcc:
  stage: fasttest
  extends: .ccscs_merge
  variables:
    CMAKE_BUILD_TYPE: Debug
    DRACO_ENV: draco/gcc1330

ccs_c4_scalar:
  stage: fasttest
  extends: .ccscs_merge
  variables:
    CMAKE_BUILD_TYPE: Debug
    DRACO_ENV: draco/gcc1330
    EXTRA_CMAKE_ARGS: -GNinja -DDRACO_C4=SCALAR -DDRACO_DIAGNOSTICS=2
    CTEST_NPROC: 40

ccs_deb_gcc16:
  stage: fasttest
  extends: .ccscs_merge
  variables:
    CMAKE_BUILD_TYPE: Debug
    DRACO_ENV: draco/gcc1610

# ---------- lint TEST (only starts if all FASTTEST pass) ---------- #

ccs_deb_no_tpl:
  stage: lint
  extends: .ccscs_merge
  variables:
    CMAKE_BUILD_TYPE: Debug
    DRACO_ENV: draco/gcc1330
  script:
    - module use --append /ccs/opt/modulefiles
    - module use /ccs/opt/vendors/dracose-2026.08.27/spack/share/spack/lmod/linux-rhel8-x86_64/Core
    - module load cmake gcc/16.1.0 ninja numdiff
    - module load openmpi
    - mkdir build && touch ci-env.log
    - set &> build/ci-env.log
    - module avail 2>&1 | tee -a build/ci-env.log
    - cmake --fresh --preset linux-debug
    - cmake --build --preset linux-debug
    - NP=$(getconf _NPROCESSORS_ONLN)
    - ctest --preset linux-debug -j ${NP}

ccs_autodoc:
  stage: lint
  extends: .ccscs_merge
  allow_failure: true
  variables:
    CMAKE_BUILD_TYPE: Debug
    DRACO_ENV: draco/gcc1610
    AUTODOC: "ON"

ccs_clangtidy:
  extends: .ccscs_merge
  stage: lint
  allow_failure: true
  variables:
    CMAKE_BUILD_TYPE: Debug
    DRACO_ENV: draco/llvm2215
    EXTRA_CMAKE_ARGS: -DDRACO_STATIC_ANALYZER=clang-tidy
    EXTRA_CTEST_ARGS: -R dsxx_tstRelease
  script:
    # Run everything under a bash shell.
    # Echo output to the screen and capture output to a file.
    # If the build command fails, report it and exit with an error code.
    # If clang-tidy warnings are found, fail the pipeline and save the log as an artifact.
    # Use grep -vE to ignore some warnings.
    - /bin/bash -l -c '
      LOG=clang-tidy-out.txt;
      ${CI_PROJECT_DIR}/.gitlab/ci/gitlab-ci-run-tests.sh 2>&1 | tee ${LOG};
      num_warnings=$(grep -nE "(^|[[:space:]])warning:" "$LOG"
        | grep -cvE "j0 forced in submake|some_known_one");
      if [[ $num_warnings -gt 0 ]]; then
        echo "==> Found $num_warnings lint warnings from clang-tidy; Pipeline failed.";
        echo "==> See attached artifact $LOG for more details.";
        exit 1;
      fi;
      echo "==> Clang-tidy lint check was successful!"
      '
  artifacts:
    paths: [clang-tidy-out.txt]
    when: on_failure
    expire_in: 7d

ccs_style_cxx:
  stage: lint
  extends: .ccscs_merge
  variables:
    CMAKE_BUILD_TYPE: Release
    DRACO_ENV: draco/gcc1610
    CTEST_NPROC: 40
    MAXLOAD: 40
  script:
    - /bin/bash -l -c "${CI_PROJECT_DIR}/.gitlab/ci/gitlab-ci-style-checks.sh"

# ---------- SLOW TEST (only starts if all regular TEST pass) ---------- #

