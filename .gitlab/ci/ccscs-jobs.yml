#--------------------------------------------------------------------------------------------------#
# Machine-wide default job settings
#--------------------------------------------------------------------------------------------------#

---
.ccscs:
  extends: .jacamar
  tags:
    - CCSNET-setuid-shared
  variables:
    SITE_ID: ccsnet
  #   CI_DEBUG_TRACE: "true"

#--------------------------------------------------------------------------------------------------#
# Deployment Jobs (run on develop after MRs are merged)
#--------------------------------------------------------------------------------------------------#

.ccscs_deploy:
  extends: .ccscs
  stage: deploy
  variables:
    DEPLOY: 'TRUE'
    FLAVOR: ${DRACO_ENV}-${CMAKE_BUILD_TYPE}
    DRACO_INSTALL_DIR: "/ccs/codes/radtran/regress/deploy/draco/${FLAVOR}"
    EXTRA_CMAKE_ARGS: -G Ninja -DCMAKE_C_FLAGS="-march=broadwell"
      -DCMAKE_Fortran_FLAGS="-march=broadwell"
  script:
    - /bin/bash -l -c "${CI_PROJECT_DIR}/.gitlab/ci/gitlab-ci-run-tests.sh"
  rules:
    # Don't deploy if this is a forked repository.
    - if: '$CI_PROJECT_NAMESPACE != "draco"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: manual
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_PIPELINE_SOURCE == "web"'

ccs_deb_gcc_cxx20_deploy:
  extends: .ccscs_deploy
  variables:
    CMAKE_BUILD_TYPE: Debug
    DRACO_ENV: gcc1330
    EXTRA_CMAKE_ARGS: -GNinja -DDraco_CXX_LANGUAGE_STANDARD=20 -DCMAKE_C_FLAGS="-march=broadwell"
      -DCMAKE_Fortran_FLAGS="-march=broadwell"
    FLAVOR: ${DRACO_ENV}-${CMAKE_BUILD_TYPE}-cxx20
    # With intel-classic on Roci, we need to add -gcc-name=/opt/cray/pe/gcc/10.3.0/snos/bin/g++

ccs_rwdi_gcc_1330_deploy:
  extends: .ccscs_deploy
  variables:
    CMAKE_BUILD_TYPE: RelWithDebInfo
    DRACO_ENV: gcc1330

ccs_c4_scalar_deploy:
  extends: .ccscs_deploy
  variables:
    CMAKE_BUILD_TYPE: Debug
    DRACO_ENV: gcc1330
    FLAVOR: ${DRACO_ENV}-${CMAKE_BUILD_TYPE}-scalar
    EXTRA_CMAKE_ARGS: -G Ninja -DDRACO_C4=SCALAR -DDRACO_DIAGNOSTICS=2
      -DCMAKE_C_FLAGS="-march=broadwell" -DCMAKE_Fortran_FLAGS="-march=broadwell"

ccs_deb_gcc_1330_deploy:
  extends: .ccscs_deploy
  variables:
    CMAKE_BUILD_TYPE: Debug
    DRACO_ENV: gcc1330

ccs_rel_gcc_1330_deploy:
  extends: .ccscs_deploy
  variables:
    CMAKE_BUILD_TYPE: Release
    DRACO_ENV: gcc1330

ccs_deb_gcc_1330_deploy:
  extends: .ccscs_deploy
  variables:
    CMAKE_BUILD_TYPE: Debug
    DRACO_ENV: gcc1330

ccs_rel_gcc_1330_deploy:
  extends: .ccscs_deploy
  variables:
    CMAKE_BUILD_TYPE: Release
    DRACO_ENV: gcc1330

ccs_fulldiag_deploy:
  extends: .ccscs_deploy
  variables:
    CMAKE_BUILD_TYPE: Debug
    DRACO_ENV: gcc1330
    FLAVOR: ${DRACO_ENV}-${CMAKE_BUILD_TYPE}-fulldiag
    # DRACO_TIMING=1 enables caliper timers.
    # DRACO_DIAGNOSTICS=7 enables FPE traps.
    EXTRA_CMAKE_ARGS: -G Ninja -DDRACO_DIAGNOSTICS=7 -DDRACO_TIMING=1 -DDRACO_LIBRARY_TYPE=STATIC
      -DCMAKE_C_FLAGS="-march=broadwell" -DCMAKE_Fortran_FLAGS="-march=broadwell"

ccs_gcov_deploy:
  extends: .ccscs_deploy
  variables:
    CMAKE_BUILD_TYPE: Debug
    DRACO_ENV: gcc1330
    FLAVOR: ${DRACO_ENV}-${CMAKE_BUILD_TYPE}-gcov
    EXTRA_CMAKE_ARGS: -DCODE_COVERAGE=ON -DCMAKE_C_FLAGS="-march=broadwell"
      -DCMAKE_Fortran_FLAGS="-march=broadwell"

ccs_valgrind_deploy:
  extends: .ccscs_deploy
  variables:
    CMAKE_BUILD_TYPE: Debug
    DRACO_ENV: gcc1330
    FLAVOR: ${DRACO_ENV}-${CMAKE_BUILD_TYPE}-valgrind
    EXTRA_CMAKE_ARGS: -DENABLE_MEMORYCHECK=ON
      -DCTEST_MEMORYCHECK_SUPPRESSIONS_FILE="${CI_PROJECT_DIR}/.gitlab/ci/valgrind_suppress.txt"
        -DCMAKE_C_FLAGS="-march=broadwell" -DCMAKE_Fortran_FLAGS="-march=broadwell"

#--------------------------------------------------------------------------------------------------#
# Deploy a Release
#--------------------------------------------------------------------------------------------------#

.ccscs_deploy_release:
  extends: .ccscs
  stage: deploy
  variables:
    DEPLOY: 'TRUE'
    DEPLOY_RELEASE: 'TRUE'
    FLAVOR: ${DRACO_ENV}-${CMAKE_BUILD_TYPE}
    DRACO_INSTALL_DIR: "/ccs/codes/radtran/regress/deploy/${CI_COMMIT_TAG}${CI_COMMIT_BRANCH}/${FLAVOR}"
    EXTRA_CMAKE_ARGS: -G Ninja -DCMAKE_C_FLAGS="-march=broadwell"
      -DCMAKE_Fortran_FLAGS="-march=broadwell"
  script:
    - echo "branch = $CI_COMMIT_BRANCH, tag = $CI_COMMIT_TAG"
    - echo "Starting ccscs_deploy_release..."
    - if [[ -z ${CI_COMMIT_BRANCH} ]]; then
        VERSION_PATCH=${CI_COMMIT_TAG//*_/};
      else
        VERSION_PATCH=${CI_COMMIT_BRANCH//*_/};
      fi
    - EXTRA_CMAKE_ARGS="${EXTRA_CMAKE_ARGS} -DDraco_VERSION_PATCH=${VERSION_PATCH}"
    - /bin/bash -l -c "${CI_PROJECT_DIR}/.gitlab/ci/gitlab-ci-run-tests.sh"
  rules:
    # Don't deploy if this is a forked repository.
    - if: '$CI_PROJECT_NAMESPACE != "draco"'
      when: never
    - if: '$CI_COMMIT_BRANCH =~ /^draco-[0-9]+(?:_[0-9]+)+$/'
    - if: '$CI_COMMIT_TAG =~ /^draco-[0-9]+(?:_[0-9]+)+$/'
    - if: '$CI_PIPELINE_SOURCE == "web"'

ccs_deb_gcc_1330_deploy_release:
  extends: .ccscs_deploy_release
  variables:
    CMAKE_BUILD_TYPE: Debug
    DRACO_ENV: gcc1330

ccs_rel_gcc_1330_deploy_release:
  extends: .ccscs_deploy_release
  variables:
    CMAKE_BUILD_TYPE: Release
    DRACO_ENV: gcc1330
    EXTRA_CMAKE_ARGS: -G Ninja -DDRACO_ROUNDOFF_MODE=FAST -DCMAKE_C_FLAGS="-march=broadwell"
      -DCMAKE_Fortran_FLAGS="-march=broadwell"

#--------------------------------------------------------------------------------------------------#
# Merge Requests
#--------------------------------------------------------------------------------------------------#

.ccscs_merge:
  extends: .ccscs
  variables:
    EXTRA_CMAKE_ARGS: -G Ninja
  script:
    - /bin/bash -l -c "${CI_PROJECT_DIR}/.gitlab/ci/gitlab-ci-run-tests.sh"
  artifacts:
    paths:
      - build/ci-env.log
  rules:
    - if: '$CI_MERGE_REQUEST_LABELS =~ /exclude_ccsnet/'
      when: never
    - if: '$CI_MERGE_REQUEST_TITLE =~ /Draft:/ || $CI_MERGE_REQUEST_TITLE =~ /WIP:/'
      when: never
    - if: '$CI_PROJECT_NAMESPACE != "draco"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "pipeline"'

# ---------- regular TEST --------------------------------------------- #

ccs_deb_gcc_1330:
  stage: fasttest
  extends: .ccscs_merge
  variables:
    CMAKE_BUILD_TYPE: Debug
    DRACO_ENV: gcc1330

ccs_deb_gcc_1330:
  stage: fasttest
  extends: .ccscs_merge
  variables:
    CMAKE_BUILD_TYPE: Debug
    DRACO_ENV: gcc1330
    EXTRA_CMAKE_ARGS: -GNinja -DDRACO_DIAGNOSTICS=2
    CTEST_NPROC: 32

ccs_c4_scalar:
  stage: fasttest
  extends: .ccscs_merge
  variables:
    CMAKE_BUILD_TYPE: Debug
    DRACO_ENV: gcc1330
    EXTRA_CMAKE_ARGS: -GNinja -DDRACO_C4=SCALAR -DDRACO_DIAGNOSTICS=2
    CTEST_NPROC: 40
    #TEST_EXCLUSIONS: mcgrid_cylindrical_mg_mgrztp04

# ---------- regular TEST (only starts if all FASTTEST pass) ---------- #

ccs_autodoc:
  stage: fasttest
  extends: .ccscs_merge
  allow_failure: true
  variables:
    CMAKE_BUILD_TYPE: Debug
    DRACO_ENV: gcc1330
    AUTODOC: "ON"

# ---------- SLOW TEST (only starts if all regular TEST pass) ---------- #

ccs_rel_gcc_1330:
  stage: slowtest
  extends: .ccscs_merge
  variables:
    CMAKE_BUILD_TYPE: Release
    DRACO_ENV: gcc1330
    CTEST_NPROC: 32

ccs_rwdi_gcc_1330:
  stage: slowtest
  extends: .ccscs_merge
  variables:
    CMAKE_BUILD_TYPE: RelWithDebInfo
    DRACO_ENV: gcc1330
    CTEST_NPROC: 32

ccs_fulldiag:
  stage: slowtest
  extends: .ccscs_merge
  variables:
    CMAKE_BUILD_TYPE: Debug
    DRACO_ENV: gcc1330
    # DRACO_TIMING=1 enables caliper timers.
    # DRACO_DIAGNOSTICS=7 enables FPE traps.
    EXTRA_CMAKE_ARGS: -G Ninja -DDRACO_DIAGNOSTICS=7 -DDRACO_TIMING=1 -DDRACO_LIBRARY_TYPE=STATIC
    CTEST_NPROC: 32

ccs_gcov:
  stage: slowtest
  extends: .ccscs_merge
  # https://regex101.com/
  coverage: '/lines[.]+: \d+\.\d+%/'
  # coverage: '/Total:\|\d+\.\d+%/'
  artifacts:
    paths:
      - build/cov-html/
      - build/coverage.txt
  variables:
    CMAKE_BUILD_TYPE: Debug
    DRACO_ENV: gcc1330
    FLAVOR: ${DRACO_ENV}-${CMAKE_BUILD_TYPE}-gcov
    EXTRA_CMAKE_ARGS: -G Ninja -DCODE_COVERAGE=ON
    CTEST_NPROC: 20

ccs_deb_gcc_1330_cxx20:
  stage: slowtest
  extends: .ccscs_merge
  variables:
    CMAKE_BUILD_TYPE: Debug
    DRACO_ENV: gcc1330
    EXTRA_CMAKE_ARGS: -GNinja -DDraco_CXX_LANGUAGE_STANDARD=20
    CTEST_NPROC: 32

