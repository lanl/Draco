#--------------------------------------------------------------------------------------------------#
# Nightly Regression
#--------------------------------------------------------------------------------------------------#

.ccscs_nightly:
  extends: .ccscs
  variables:
    CTEST_MODE: Nightly
    CTEST_BUILD_NAME: ${DRACO_ENV}-${CMAKE_BUILD_TYPE}
    EXTRA_CMAKE_ARGS: -G Ninja
  script:
    - /bin/bash -l -c "${CI_PROJECT_DIR}/.gitlab/ci/gitlab-nightly-regress.sh"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'

rel_gcc_12.2.0_regress:
  extends: .ccscs_nightly
  variables:
    CMAKE_BUILD_TYPE: Release
    DRACO_ENV: gcc1330
    CTEST_NPROC: 40

deb_gcc_12.2.0_regress:
  extends: .ccscs_nightly
  variables:
    CMAKE_BUILD_TYPE: Debug
    DRACO_ENV: gcc1330
    CTEST_NPROC: 40

deb_gcc_12.2.0_cxx20_regress:
  extends: .ccscs_nightly
  variables:
    CMAKE_BUILD_TYPE: Debug
    DRACO_ENV: gcc1330
    EXTRA_CMAKE_ARGS: -GNinja -DDraco_CXX_LANGUAGE_STANDARD=20
    CTEST_NPROC: 40

deb_gcc_scalar_regress:
  extends: .ccscs_nightly
  variables:
    CMAKE_BUILD_TYPE: Debug
    DRACO_ENV: gcc1330
    FLAVOR: ${DRACO_ENV}-${CMAKE_BUILD_TYPE}-scalar
    EXTRA_CMAKE_ARGS: -G Ninja -DDRACO_C4=SCALAR
    CTEST_NPROC: 40
    CTEST_BUILD_NAME: c4-scalar

fulldiag_regress:
  extends: .ccscs_nightly
  variables:
    CMAKE_BUILD_TYPE: Debug
    DRACO_ENV: gcc1330
    FLAVOR: ${DRACO_ENV}-${CMAKE_BUILD_TYPE}-fulldiag
    # DRACO_TIMING=1 enables caliper timers.
    # DRACO_DIAGNOSTICS=7 enables FPE traps.
    EXTRA_CMAKE_ARGS: -G Ninja -DDRACO_DIAGNOSTICS=7 -DDRACO_TIMING=1 -DDRACO_LIBRARY_TYPE=STATIC
    CTEST_NPROC: 40
    CTEST_BUILD_NAME: fulldiag-static

gcov_regress:
  extends: .ccscs_nightly
  coverage: '/Coverage:\s\d+\.\d+%/'
  variables:
    CMAKE_BUILD_TYPE: Debug
    DRACO_ENV: gcc1330
    FLAVOR: ${DRACO_ENV}-${CMAKE_BUILD_TYPE}-gcov
    EXTRA_CMAKE_ARGS: -DCODE_COVERAGE=ON
    CTEST_NPROC: 40
    CTEST_BUILD_NAME: gcov

valgrind_regress:
  extends: .ccscs_nightly
  variables:
    CMAKE_BUILD_TYPE: Debug
    DRACO_ENV: gcc1330
    FLAVOR: ${DRACO_ENV}-${CMAKE_BUILD_TYPE}-valgrind
    MEMCHECK_CONFIGURATION: "ON"
    # Use broadwell arch flag to prevent use of avx512 instructions that break valgrind
    EXTRA_CMAKE_ARGS: -G Ninja -DCMAKE_C_FLAGS="-march=broadwell"
      -DCMAKE_Fortran_FLAGS="-march=broadwell"
    CTEST_MEMORYCHECK_SUPPRESSIONS_FILE: "${CI_PROJECT_DIR}/.gitlab/ci/valgrind_suppress.txt"
    # EXTRA_CTEST_ARGS: "INCLUDE_LABEL memcheck EXCLUDE_LABEL nomemcheck"
    EXTRA_CTEST_ARGS: "EXCLUDE_LABEL nomemcheck"
    CTEST_NPROC: 40
    CTEST_BUILD_NAME: valgrind

pages:
  stage: test
  extends: .ccscs_nightly
  variables:
    CMAKE_BUILD_TYPE: Debug
    DRACO_ENV: gcc1330
    DEPLOY: "TRUE"
    AUTODOC: "ON"
    AUTODOCDIR: "${CI_PROJECT_DIR}/public"
    CTEST_BUILD_NAME: autodoc
  artifacts:
    paths:
      - public

#--------------------------------------------------------------------------------------------------#
# Re-deploy dependent projects
#--------------------------------------------------------------------------------------------------#

.downstream-deploy:
  stage: deploy-downstream
  variables:
    DEPLOY: 'TRUE'
  trigger:
    branch: develop
    strategy: depend
  rules:
    # Don't deploy if this is a forked repository.
    - if: '$CI_PROJECT_NAMESPACE != "draco"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_PIPELINE_SOURCE == "web"'

downstream-deploy-dert:
  extends: .downstream-deploy
  variables:
    PROJECT: 'DeRT'
  trigger:
    project: capsaicin/dert

downstream-deploy-jayenne:
  extends: .downstream-deploy
  variables:
    PROJECT: 'Jayenne'
  trigger:
    project: jayenne/jayenne

#--------------------------------------------------------------------------------------------------#
# Regressions: collect data from LLNL RZ systems and post it to cdash
#--------------------------------------------------------------------------------------------------#

.post_rz_regress_results_to_cdash:
  extends: .jacamar
  tags:
    - CCSNET-setuid-shared
  stage: test
  allow_failure: true
  variables:
    CTEST_MODE: Nightly
  script:
    - mkdir -p ${DRACO_BINARY_DIR} && cd ${DRACO_BINARY_DIR}
    # The artifacts from the jobs listed under the 'needs:' section should already be here.
    - ls *.tar
    - module use /ccs/codes/radtran/Modules
    - module load draco/gcc1330
    - export CTEST=$(which ctest)
    - >
      for tf in $(\ls -1 *.tar); do
          cd ${DRACO_BINARY_DIR};
          build_dir=${tf//.tar/};
          CTEST_SITE=$(echo ${tf} | sed -e 's/-.*//');
          CMAKE_BUILD_TYPE=${tf//*-/};
          CMAKE_BUILD_TYPE=${CMAKE_BUILD_TYPE//.tar/}
          echo -e "\n============================================================";
          echo "Examining ${build_dir} (${CTEST_SITE})";
          echo -e "============================================================\n";
          mkdir -p ${build_dir} && cd ${build_dir};
          tar -xvf ../${tf};
          echo "==> cat Update.xml"
          cat Testing/*/Update.xml
          echo "---(end)---"
          cp DartConfiguration.tcl DartConfiguration.tcl.bak;
          sed -i "s%SourceDirectory.*%SourceDirectory: ${DRACO_SOURCE_DIR}%" DartConfiguration.tcl;
          sed -i "s%BuildDirectory.*%BuildDirectory: ${DRACO_BINARY_DIR}/${build_dir}%" \
            DartConfiguration.tcl;
          sed -i "s%SubmitURL:.*%SubmitURL: ${CTEST_SUBMIT_URL}%" DartConfiguration.tcl;
          tag=`head -n 1 Testing/TAG`;
          CTEST_BUILD_NAME=`grep BuildName Testing/${tag}/Build.xml | sed -e s'/.*\"\(.*\)\"/\1/'`;
          sed -i "s%BuildName.*%BuildName: ${CTEST_BUILD_NAME}%" DartConfiguration.tcl;
          sed -i "s%Site.*%Site: ${CTEST_SITE}%" DartConfiguration.tcl;
          echo -e "\n-- Modified values:\n";
          if [[ $(diff -a DartConfiguration.tcl.bak DartConfiguration.tcl > diff.txt; \
            cat diff.txt | wc -l) -gt 0 ]]; then cat diff.txt; fi;
          export CTEST_BUILD_NAME CTEST_SITE CMAKE_BUILD_TYPE;
          cp DartConfiguration.tcl ${DRACO_BINARY_DIR};
          cp -r Testing ${DRACO_BINARY_DIR};
          echo "==> test -VV -S ${DRACO_SOURCE_DIR}/.gitlab/ci/draco-nightly.cmake,Submit";
          ${CTEST} -V -S ${DRACO_SOURCE_DIR}/.gitlab/ci/draco-nightly.cmake,Submit;
          rm ${DRACO_BINARY_DIR}/DartConfiguration.tcl;
          rm -rf ${DRACO_BINARY_DIR}/Testing;
          sleep 5
      done;
    - echo "==> PASS -- RZ test results submitted to CDash."
  rules:
    - if: '$CI_PROJECT_NAMESPACE != "draco"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "schedule"'

post_rzadams_regress_results_to_cdash:
  extends: .post_rz_regress_results_to_cdash
  needs:
    - job: rzadams_deb_amdclang_regress
      artifacts: true
    - job: rzadams_rel_amdclang_regress
      artifacts: true

#--------------------------------------------------------------------------------------------------#
# end .gitlab/ci/ccscs-jobs.yml
