    # DRACO_DIAGNOSTICS=7 enables FPE traps.
    EXTRA_CMAKE_ARGS: -G Ninja -DDRACO_DIAGNOSTICS=7 -DDRACO_TIMING=1 -DDRACO_LIBRARY_TYPE=STATIC
    CTEST_NPROC: 40

ccs_gcov:
  stage: slowtest
  extends: .ccscs_merge
  # https://regex101.com/
  coverage: '/lines[.]+: \d+\.\d+%/'
  # coverage: '/Total:\|\d+\.\d+%/'
  artifacts:
    paths:
      - build/cov-html/
      - build/coverage.txt
  variables:
    CMAKE_BUILD_TYPE: Debug
    DRACO_ENV: draco/gcc1330
    FLAVOR: ${DRACO_ENV}-${CMAKE_BUILD_TYPE}-gcov
    EXTRA_CMAKE_ARGS: -G Ninja -DCODE_COVERAGE=ON
    CTEST_NPROC: 20

ccs_deb_gcc_cxx23:
  stage: slowtest
  extends: .ccscs_merge
  variables:
    CMAKE_BUILD_TYPE: Debug
    DRACO_ENV: draco/gcc1330
    EXTRA_CMAKE_ARGS: -GNinja -DDraco_CXX_LANGUAGE_STANDARD=23
    CTEST_NPROC: 40

