#--------------------------------------------------------------------------------------------------#
# Machine-wide default job settings
#--------------------------------------------------------------------------------------------------#

---
.fog:
  extends: .jacamar
  tags:
    - fog
    - batch
  variables:
    SITE_ID: fog
    CTEST_SITE: ${SITE_ID}
    SCHEDULER_PARAMETERS: "-N 1 -A asc-ci --partition=ci --qos=ci --reservation=ci -L none@slurmdb"
    EXTRA_CMAKE_ARGS: -GNinja
    # CI_DEBUG_TRACE: "true"

#--------------------------------------------------------------------------------------------------#
# Deployment Jobs (run on develop after MRs are merged)
#--------------------------------------------------------------------------------------------------#

.fog_deploy:
  extends: .fog
  stage: deploy
  variables:
    DEPLOY: 'TRUE'
    DRACO_INSTALL_DIR: "/usr/projects/draco/deploy/${FLAVOR}"
  script:
    - /bin/bash -l -c "${CI_PROJECT_DIR}/.gitlab/ci/gitlab-ci-run-tests.sh"
  resource_group: ${SITE_ID}-${DRACO_ENV}-${CMAKE_BUILD_TYPE}
  rules:
    # Don't deploy if this is a forked repository.
    - if: '$CI_PROJECT_NAMESPACE != "draco"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_PIPELINE_SOURCE == "web"'

fg_rel_i2120_deploy:
  extends: .fog_deploy
  variables:
    CMAKE_BUILD_TYPE: Release
    DRACO_ENV: "lapse/2.4.0-intel"
    FLAVOR: lapse240-intel-Release

fg_deb_i2120_deploy:
  extends: .fog_deploy
  variables:
    CMAKE_BUILD_TYPE: Debug
    DRACO_ENV: "lapse/2.4.0-intel"
    FLAVOR: lapse240-intel-Debug

#--------------------------------------------------------------------------------------------------#
# Deploy a Release
#--------------------------------------------------------------------------------------------------#

.fg_deploy_release:
  extends: .fog
  stage: deploy
  variables:
    DEPLOY: 'TRUE'
    DEPLOY_RELEASE: 'TRUE'
    FLAVOR: ${DRACO_ENV}-${CMAKE_BUILD_TYPE}
    DRACO_INSTALL_DIR: "/usr/projects/draco/${CI_COMMIT_TAG}${CI_COMMIT_BRANCH}/${SITE_ID}/${FLAVOR}"
  script:
    - echo "branch = $CI_COMMIT_BRANCH, tag = $CI_COMMIT_TAG"
    - echo "Starting fg_deploy_release..."
    - if [[ -z ${CI_COMMIT_BRANCH} ]]; then
        VERSION_PATCH=${CI_COMMIT_TAG//*_/};
      else
        VERSION_PATCH=${CI_COMMIT_BRANCH//*_/};
      fi
    - EXTRA_CMAKE_ARGS="${EXTRA_CMAKE_ARGS} -DDraco_VERSION_PATCH=${VERSION_PATCH}"
    - /bin/bash -l -c "${CI_PROJECT_DIR}/.gitlab/ci/gitlab-ci-run-tests.sh"
  resource_group: ${SITE_ID}-${DRACO_ENV}-${CMAKE_BUILD_TYPE}
  rules:
    # Don't deploy if this is a forked repository.
    - if: '$CI_PROJECT_NAMESPACE != "draco"'
      when: never
    - if: '$CI_COMMIT_BRANCH =~ /^draco-[0-9]+(?:_[0-9]+)+$/'
    - if: '$CI_COMMIT_TAG =~ /^draco-[0-9]+(?:_[0-9]+)+$/'
    - if: '$CI_PIPELINE_SOURCE == "web"'

fg_rel_i2120_deploy_release:
  extends: .fg_deploy_release
  variables:
    CMAKE_BUILD_TYPE: Release
    DRACO_ENV: "lapse/2.4.0-intel"
    EXTRA_CMAKE_ARGS: -GNinja -DDRACO_ROUNDOFF_MODE=FAST

fg_deb_i2120_deploy_release:
  extends: .fg_deploy_release
  variables:
    CMAKE_BUILD_TYPE: Debug
    DRACO_ENV: "lapse/2.4.0-intel"

fg_rwdi_i2120_deploy_release:
  extends: .fg_deploy_release
  variables:
    CMAKE_BUILD_TYPE: RelWithDebInfo
    DRACO_ENV: "lapse/2.4.0-intel"
    EXTRA_CMAKE_ARGS: -GNinja -DDRACO_DBC_LEVEL=15

#--------------------------------------------------------------------------------------------------#
# Merge Requests
#--------------------------------------------------------------------------------------------------#

.fog_merge:
  extends: .fog
  # allow_failure: true
  script:
    - /bin/bash -l -c "${CI_PROJECT_DIR}/.gitlab/ci/gitlab-ci-run-tests.sh"
  rules:
    - if: '$CI_MERGE_REQUEST_LABELS =~ /exclude_fog/'
      when: never
    - if: '$CI_MERGE_REQUEST_TITLE =~ /Draft:/ || $CI_MERGE_REQUEST_TITLE =~ /WIP:/'
      when: never
    - if: '$CI_PROJECT_NAMESPACE != "draco"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "pipeline"'

# ----- fast -----

fg_rel_i2120_mr:
  stage: fasttest
  extends: .fog_merge
  variables:
    CMAKE_BUILD_TYPE: Release
    DRACO_ENV: "lapse/2.4.0-intel"

# ----- regular test -----

fg_deb_i2120_mr:
  stage: test
  extends: .fog_merge
  variables:
    CMAKE_BUILD_TYPE: Debug
    DRACO_ENV: "lapse/2.4.0-intel"

#--------------------------------------------------------------------------------------------------#
# Nightly Regression
#--------------------------------------------------------------------------------------------------#

.fog_nightly:
  extends: .fog
  variables:
    CTEST_MODE: Nightly
    # CTEST_MODE: Experimental
    CTEST_NPROC: 36
  script:
    - /bin/bash -l "${CI_PROJECT_DIR}/.gitlab/ci/gitlab-nightly-regress.sh" -m
      "Configure,Build,Test"
  after_script:
    - /bin/bash -l "${CI_PROJECT_DIR}/.gitlab/ci/gitlab-nightly-regress.sh" -m "Submit"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'

fg_rel_i2120_regress:
  stage: test
  extends: .fog_nightly
  variables:
    CMAKE_BUILD_TYPE: Release
    DRACO_ENV: "lapse/2.4.0-intel"
    CTEST_BUILD_NAME: "lapse240-intel-Release"

fg_deb_i2120_regress:
  stage: test
  extends: .fog_nightly
  variables:
    CMAKE_BUILD_TYPE: Debug
    DRACO_ENV: "lapse/2.4.0-intel"
    CTEST_BUILD_NAME: "lapse240-intel-Debug"

#--------------------------------------------------------------------------------------------------#
# end .gitlab/ci/fog-jobs.yml
#--------------------------------------------------------------------------------------------------#
