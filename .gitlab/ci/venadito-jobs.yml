#--------------------------------------------------------------------------------------------------#
# Machine-wide default job settings
#--------------------------------------------------------------------------------------------------#

---
.vt:
  extends: .jacamar
  tags:
    - venadito
    - batch
  variables:
    SITE_ID: venadito
    CTEST_SITE: ${SITE_ID}
    CTEST_NPROC: 288
    EXTRA_CMAKE_ARGS: -G Ninja
    FLAVOR: ${DRACO_ENV}-${CMAKE_BUILD_TYPE}
    SCHEDULER_PARAMETERS: -N 1 -t 30:00 -L none@slurmdb -A vt-ci_g --partition=ci_g --qos=ci_g
      --reservation=ci_g

#--------------------------------------------------------------------------------------------------#
# Deployment Jobs (run on develop after MRs are merged)
#--------------------------------------------------------------------------------------------------#

.vt_deploy:
  extends: .vt
  stage: deploy
  variables:
    DEPLOY: 'TRUE'
    DRACO_INSTALL_DIR: "/usr/projects/draco/deploy/${SITE_ID}/${FLAVOR}"
    SCHEDULER_PARAMETERS: -N 1 -t 30:00 -p gpu -A vt-normal_g -L none@slurmdb
  script:
    - /bin/bash -l -c "${CI_PROJECT_DIR}/.gitlab/ci/gitlab-ci-run-tests.sh"
  rules:
    # Don't deploy if this is a forked repository.
    - if: '$CI_PROJECT_NAMESPACE != "draco"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_PIPELINE_SOURCE == "web"'

vt_deploy_rel_gnu:
  extends: .vt_deploy
  variables:
    CMAKE_BUILD_TYPE: Release
    DRACO_ENV: "lapse/3.1.0-gnu-cpu"

vt_deploy_deb_gnu:
  extends: .vt_deploy
  variables:
    CMAKE_BUILD_TYPE: Debug
    DRACO_ENV: "lapse/3.1.0-gnu-cpu"

#--------------------------------------------------------------------------------------------------#
# Deploy a versioned release (dvr)
#--------------------------------------------------------------------------------------------------#

.vt_dvr:
  extends: .vt
  stage: deploy
  variables:
    DEPLOY: 'TRUE'
    DEPLOY_RELEASE: 'TRUE'
    FLAVOR: ${DRACO_ENV}-${CMAKE_BUILD_TYPE}
    DRACO_INSTALL_DIR: "/usr/projects/draco/${CI_COMMIT_TAG}${CI_COMMIT_BRANCH}/${SITE_ID}/${FLAVOR}"
    SCHEDULER_PARAMETERS: -N 1 -t 30:00 -A vt-normal_g -p gpu -L none@slurmdb
  script:
    - echo "branch = $CI_COMMIT_BRANCH, tag = $CI_COMMIT_TAG"
    - echo "Starting vt_deploy_release..."
    - if [[ -z ${CI_COMMIT_BRANCH} ]]; then
        VERSION_PATCH=${CI_COMMIT_TAG//*_/};
      else
        VERSION_PATCH=${CI_COMMIT_BRANCH//*_/};
      fi
    - EXTRA_CMAKE_ARGS="${EXTRA_CMAKE_ARGS} -DDraco_VERSION_PATCH=${VERSION_PATCH}"
    - /bin/bash -l -c "${CI_PROJECT_DIR}/.gitlab/ci/gitlab-ci-run-tests.sh"
  rules:
    # Don't deploy if this is a forked repository.
    - if: '$CI_PROJECT_NAMESPACE != "draco"'
      when: never
    - if: '$CI_COMMIT_BRANCH =~ /^draco-[0-9]+(?:_[0-9]+)+$/'
    - if: '$CI_COMMIT_TAG =~ /^draco-[0-9]+(?:_[0-9]+)+$/'
    - if: '$CI_PIPELINE_SOURCE == "web"'

vt_dvr_rel_gnu:
  extends: .vt_dvr
  variables:
    CMAKE_BUILD_TYPE: Release
    DRACO_ENV: "lapse/3.1.0-gnu-cpu"
    EXTRA_CMAKE_ARGS: -GNinja -DDRACO_ROUNDOFF_MODE=FAST

vt_dvr_deb_gnu:
  extends: .vt_dvr
  variables:
    CMAKE_BUILD_TYPE: Debug
    DRACO_ENV: "lapse/3.1.0-gnu-cpu"

vt_dvr_rwdi_gnu:
  extends: .vt_dvr
  variables:
    CMAKE_BUILD_TYPE: RelWithDebInfo
    DRACO_ENV: "lapse/3.1.0-gnu-cpu"
    EXTRA_CMAKE_ARGS: -GNinja -DDRACO_DBC_LEVEL=15

#--------------------------------------------------------------------------------------------------#
# Merge Requests
#--------------------------------------------------------------------------------------------------#

.vt_merge:
  extends: .vt
  allow_failure: true
  variables:
    SCHEDULER_PARAMETERS: -N 1 -L none@slurmdb -t 30:00 -A vt-ci_g --partition=ci_g --qos=ci_g
      --reservation=ci_g
  script:
    - /bin/bash -l -c "${CI_PROJECT_DIR}/.gitlab/ci/gitlab-ci-run-tests.sh"
  rules:
    - if: '$CI_MERGE_REQUEST_LABELS =~ /exclude_venadito/'
      when: never
    - if: '$CI_MERGE_REQUEST_TITLE =~ /Draft:/ || $CI_MERGE_REQUEST_TITLE =~ /WIP:/'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "pipeline"'

# ----- fast -----

# none

# ----- regular test -----

vt_deb_gnu_mr:
  extends: .vt_merge
  variables:
    CMAKE_BUILD_TYPE: Debug
    DRACO_ENV: "lapse/3.1.0-gnu-cpu"

# ----- slow -----

#--------------------------------------------------------------------------------------------------#
# Nightly Regression
#--------------------------------------------------------------------------------------------------#

.vt_nightly:
  extends: .vt
  stage: test
  variables:
    CTEST_MODE: Nightly
    CTEST_BUILD_NAME: ${DRACO_ENV}-${CMAKE_BUILD_TYPE}
    SCHEDULER_PARAMETERS: -N 1 -t 30:00 -A vt-normal_g -p gpu -L none@slurmdb
  script:
    - /bin/bash -l "${CI_PROJECT_DIR}/.gitlab/ci/gitlab-nightly-regress.sh" -m
      "Configure,Build,Test"
  after_script:
    - /bin/bash -l "${CI_PROJECT_DIR}/.gitlab/ci/gitlab-nightly-regress.sh" -m "Submit"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'

vt_deb_gnu_regress:
  extends: .vt_nightly
  variables:
    CMAKE_BUILD_TYPE: Debug
    DRACO_ENV: "lapse/3.1.0-gnu-cpu"

vt_rel_gnu_regress:
  extends: .vt_nightly
  variables:
    CMAKE_BUILD_TYPE: Release
    DRACO_ENV: "lapse/3.1.0-gnu-cpu"

#--------------------------------------------------------------------------------------------------#
# end .gitlab/ci/vt-jobs.yml
#--------------------------------------------------------------------------------------------------#
