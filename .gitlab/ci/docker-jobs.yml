---
superlinter:
  tags:
    - charm
  stage: lint
  image:
      name: docker.io/github/super-linter:slim-latest
  script:
    - /action/lib/linter.sh
  # artifacts:
  #   paths:
  #     - $CI_PROJECT_DIR/super-linter.log
  rules:
    - if: '$CI_MERGE_REQUEST_LABELS =~ /exclude_darwin/'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "pipeline"'
  variables:
    RUN_LOCAL: "true"
    DEFAULT_WORKSPACE: $CI_PROJECT_DIR
    ANSIBLE_DIRECTORY: $CI_PROJECT_PATH
    LINTER_RULES_PATH: $CI_PROJECT_PATH/.github/linters
    # LOG_FILE: $CI_PROJECT_DIR/super-linter.log
    DEFAULT_BRANCH: $CI_MERGE_REQUEST_TARGET_BRANCH_NAME
    ERROR_ON_MISSING_EXEC_BIT: "true"
    FILTER_REGEX_EXCLUDE: (.*[.]cc$|/test/)
    PYTHON_FLAKE8_CONFIG_FILE: .flake8
    SUPPRESS_POSSUM: "true"
    JSCPD_CONFIG_FILE: "../../../builds/draco/draco/.gitlab/ci/.jscpd.json"
    # LOG_LEVEL: NOTICE
    VALIDATE_ALL_CODEBASE: "false"
    VALIDATE_BASH: "true"
    VALIDATE_BASH_EXEC: "true"
    VALIDATE_DOCKERFILE: "true"
    VALIDATE_ENV: "true"
    VALIDATE_GITLEAKS: "true"
    VALIDATE_HTML: "true"
    # VALIDATE_JSCPD: "true"
    VALIDATE_JSON: "true"
    VALIDATE_LUA: "true"
    VALIDATE_MARKDOWN: "true"
    VALIDATE_PERL: "true"
    VALIDATE_PYTHON: "true"
    VALIDATE_PYTHON_FLAKE8: "true"
    VALIDATE_POWERSHELL: "true"
    VALIDATE_RUBY: "true"
    VALIDATE_SHELL_SHFMT: "true"
    VALIDATE_XML: "true"
    # CI_DEBUG_TRACE: "true"

#--------------------------------------------------------------------------------------------------#

checkCoverage_MR:
  # Ref: https://re-git.lanl.gov/draco/devops/-/wikis/Fail-a-CI-test-if-coverage-decreases
  # CI_API_V4_URL = https://re-git.lanl.gov/api/v4
  # CI_MERGE_REQUEST_PROJECT_ID = 503 (draco)
  # TARGET_COVERAGE_PERCENT is set in the gitlab CI variables section of the GUI.
  tags:
    - charm
  stage: metrics
  dependencies:
    - ccs_gcov
  image:
    name: docker.io/library/alpine:3.18
  before_script:
    - apk add --quiet --update --no-cache curl jq bc
  variables:
    BASE_URL: "${CI_API_V4_URL}/projects/${CI_MERGE_REQUEST_PROJECT_ID}/pipelines"
    URL: "${BASE_URL}/${CI_PIPELINE_ID}/jobs?private_token=${PRIVATE_TOKEN}"
  artifacts:
    paths:
      - ${CI_JOB_NAME}.log
  script:
    # - echo "curl -k -s ${URL} --> ${CI_JOB_NAME}.log"
    # - curl -k -s ${URL}
    - curl -k -s ${URL} > ${CI_JOB_NAME}.log
    - CURRENT_COVERAGE=$(jq --arg JOB_NAME ccs_gcov
      '.[] | select (.name=="ccs_gcov") | .coverage' < "${CI_JOB_NAME}.log")
    - echo "TARGET_COVERAGE  = ${TARGET_COVERAGE_PERCENT}"
    - echo "CURRENT_COVERAGE = ${CURRENT_COVERAGE}"
    - >
      if [ "${CURRENT_COVERAGE}notset" == "notset" ]; then
        echo "==> FAIL: Error extracting coverage metric." && exit 1; fi
    - >
      if [ $(echo "${CURRENT_COVERAGE} < ${TARGET_COVERAGE_PERCENT}"|bc) == 1 ]; then
        echo -n  "==> FAIL: Code coverage for this MR is below target value of " &&
        echo "${TARGET_COVERAGE_PERCENT}" && exit 1;
      else
        echo "==> PASS: Code coverage for this MR meets minimum requirements" &&
        echo "    ${CURRENT_COVERAGE}% > ${TARGET_COVERAGE_PERCENT}%";
      fi
  rules:
    - if: '$CI_MERGE_REQUEST_LABELS =~ /exclude_ccsnet/'
      when: never
    - if: '$CI_MERGE_REQUEST_LABELS =~ /exclude_darwin/'
      when: never
    - if: '$CI_MERGE_REQUEST_TITLE =~ /Draft:/ || $CI_MERGE_REQUEST_TITLE =~ /WIP:/'
      when: never
    - if: '$CI_PROJECT_NAMESPACE != "draco"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "develop"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "pipeline"'

#--------------------------------------------------------------------------------------------------#
# Use MR action to trigger restart of CI pipleline via webhook when MR title changes.
#
# 1. This requires a trigger token (Settings -> CI/CD -> Pipeline trigger token)
# 2. Create a webhook (Settings -> Webhook).  Something like...
#    https://re-git.lanl.gov/api/v4/projects/503/ref/webhook/trigger/pipeline?token=<token>
# 3. Save the webhook token to the CI/CD variables as CI_JOB_TOKEN
#
#--------------------------------------------------------------------------------------------------#
titlechange:
  tags:
    - charm
  stage: test
  image:
    name: docker.io/library/alpine:3.18
  before_script:
    - apk add --quiet --update --no-cache curl jq
  script:
    - echo $TRIGGER_PAYLOAD
    - cat $TRIGGER_PAYLOAD
    - 'export SOURCE=$(cat $TRIGGER_PAYLOAD | jq -r .object_attributes.source_branch)'
    - 'export PREVIOUS=$(cat $TRIGGER_PAYLOAD | jq -r .changes.title.previous)'
    - 'export CURRENT=$(cat $TRIGGER_PAYLOAD | jq -r .changes.title.current)'
    - echo $SOURCE
    - echo $PREVIOUS
    - echo $CURRENT
    - >
      if [[ "$PREVIOUS" != "$CURRENT" ]] && \
        ( [[ "$PREVIOUS" =~ "WIP:" ]] || [[ "$PREVIOUS" =~ "Draft:" ]] ) && \
        ! ( [[ "$CURRENT" =~ "WIP:" ]] && [[ "$CURRENT" =~ "Draft:" ]] );
      then \
        echo "==> curl --request POST --form ref=${SOURCE}";
        echo "    https://re-git.lanl.gov/api/v4/projects/${CI_PROJECT_ID}/trigger/pipeline";
        curl --request POST --form "token=$CI_JOB_TOKEN" --form "ref=${SOURCE}" \
          "https://re-git.lanl.gov/api/v4/projects/${CI_PROJECT_ID}/trigger/pipeline";
      else
        echo "==> Skip webhook. WIP/Draft not removed from title.";
      fi;
  rules:
    - if: '$CI_PIPELINE_SOURCE == "trigger"'

#--------------------------------------------------------------------------------------------------#
# end .gitlab/ci/docker-jobs.yml
#--------------------------------------------------------------------------------------------------#
