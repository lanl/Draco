#--------------------------------------------------------------------------------------------------#
# Machine-wide default job settings
#
# * rzadams (MI300):
#   * 64 cores / node
#   * 8 effective GPU chiplets
#--------------------------------------------------------------------------------------------------#

---
.rzadams:
  extends: .jacamar
  tags:
    - rzadams
    - batch
  variables:
    SITE_ID: rzadams
    CTEST_SITE: ${SITE_ID}
    CTEST_NPROC: 64
    SCHEDULER_PARAMETERS: -N 1 --begin=+5s
    LLNL_SLURM_SCHEDULER_PARAMETERS: -N 1 --begin=+5s

#--------------------------------------------------------------------------------------------------#
# Deployment Jobs (run on develop after MRs are merged)
#--------------------------------------------------------------------------------------------------#

.rzadams_deploy:
  extends: .rzadams
  stage: deploy
  variables:
    DEPLOY: 'TRUE'
    EXTRA_CMAKE_ARGS: -GNinja -DUSE_GPU=ON -DUSE_OPENMP=OFF
    FLAVOR: ${DRACO_ENV}-${CMAKE_BUILD_TYPE}
    DRACO_INSTALL_DIR: /usr/gapps/jayenne/deploy/${SITE_ID}/${FLAVOR}/${PROJECT}
  script:
    - mkdir -p /usr/gapps/jayenne/deploy/${SITE_ID}/${FLAVOR}
    - chmod g+rwX,o+rX /usr/gapps/jayenne/deploy/${SITE_ID}/${FLAVOR} || echo "Unable to chmod"
    - chmod g+s /usr/gapps/jayenne/deploy/${SITE_ID}/${FLAVOR} || echo "Unable to chmod"
    - /bin/bash -l -c "${CI_PROJECT_DIR}/.gitlab/ci/gitlab-ci-run-tests.sh"
  rules:
    # Don't deploy if this is a forked repository.
    - if: '$CI_PROJECT_NAMESPACE != "draco"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: manual
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_PIPELINE_SOURCE == "web"'

rzadams_deploy_rel_amdclang:
  extends: .rzadams_deploy
  variables:
    DRACO_ENV: "lapse/3.0.1-amdclang"
    CMAKE_BUILD_TYPE: Release

rzadams_deploy_deb_amdclang:
  extends: .rzadams_deploy
  variables:
    DRACO_ENV: "lapse/3.0.1-amdclang"
    CMAKE_BUILD_TYPE: Debug

#--------------------------------------------------------------------------------------------------#
# Deploy a versioned release (dvr)
#--------------------------------------------------------------------------------------------------#

# none

#--------------------------------------------------------------------------------------------------#
# Merge Requests
#--------------------------------------------------------------------------------------------------#

.rzadams_merge:
  extends: .rzadams
  allow_failure: true
  script:
    - /bin/bash -l -c "${CI_PROJECT_DIR}/.gitlab/ci/gitlab-ci-run-tests.sh"
  rules:
    - if: '$CI_MERGE_REQUEST_LABELS =~ /exclude_rzadams/'
      when: never
    - if: '$CI_MERGE_REQUEST_TITLE =~ /Draft:/ || $CI_MERGE_REQUEST_TITLE =~ /WIP:/'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "pipeline"'

# ----- regular test -----

rzadams_rel_amdclang_mr:
  stage: test
  extends: .rzadams_merge
  variables:
    CMAKE_BUILD_TYPE: Release
    DRACO_ENV: "lapse/3.0.1-amdclang"
    EXTRA_CMAKE_ARGS: -GNinja -DUSE_GPU=ON -DUSE_OPENMP=OFF

rzadams_deb_amdclang_mr:
  stage: test
  extends: .rzadams_merge
  variables:
    CMAKE_BUILD_TYPE: Debug
    DRACO_ENV: "lapse/3.0.1-amdclang"
    EXTRA_CMAKE_ARGS: -GNinja -DUSE_GPU=ON -DUSE_OPENMP=OFF

#--------------------------------------------------------------------------------------------------#
# Nightly Regression
#--------------------------------------------------------------------------------------------------#

.rzadams_nightly:
  extends: .rzadams
  allow_failure: true
  variables:
    CTEST_MODE: Nightly
    CTEST_NPROC: 128
    EXTRA_CMAKE_ARGS: -GNinja -DUSE_GPU=ON -DUSE_OPENMP=OFF
  artifacts:
    when: always
    paths:
      - build/${SITE_ID}-${PROJECT}-${CTEST_MODE}-${CTEST_BUILD_NAME}.tar
  script:
    - /bin/bash -l "${CI_PROJECT_DIR}/.gitlab/ci/gitlab-nightly-regress.sh"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'

rzadams_rel_amdclang_regress:
  stage: test
  extends: .rzadams_nightly
  variables:
    CTEST_BUILD_NAME: "lapse301-amdclang-${CMAKE_BUILD_TYPE}"
    DRACO_ENV: "lapse/3.0.1-amdclang"
    CMAKE_BUILD_TYPE: Release

rzadams_deb_amdclang_regress:
  stage: test
  extends: .rzadams_nightly
  variables:
    CTEST_BUILD_NAME: "lapse301-amdclang-${CMAKE_BUILD_TYPE}"
    DRACO_ENV: "lapse/3.0.1-amdclang"
    CMAKE_BUILD_TYPE: Debug

rzadams_deb_amdclang_regress_gpuaware:
  stage: test
  extends: .rzadams_nightly
  variables:
    CTEST_BUILD_NAME: "lapse301-amdclang-${CMAKE_BUILD_TYPE}"
    DRACO_ENV: "lapse/3.0.1-amdclang"
    CMAKE_BUILD_TYPE: Debug
    EXTRA_CMAKE_ARGS: -DUSE_GPU_AWARE=ON
    MPICH_GPU_SUPPORT_ENABLED: 1

#--------------------------------------------------------------------------------------------------#
# end .gitlab/ci/rzadams-jobs.yml
#--------------------------------------------------------------------------------------------------#
