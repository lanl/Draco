#--------------------------------------------------------------------------------------------------#
# Machine-wide default job settings
#--------------------------------------------------------------------------------------------------#

---
.ve:
  extends: .jacamar
  tags:
    - venado
    - batch
  variables:
    SITE_ID: venado
    CTEST_SITE: ${SITE_ID}
    CTEST_NPROC: 144
    EXTRA_CMAKE_ARGS: -G Ninja
    FLAVOR: ${DRACO_ENV}-${CMAKE_BUILD_TYPE}
    # SCHEDULER_PARAMETERS: -N 1 -t 30:00 -L none@slurmdb -A asc-ci --partition=ci --qos=ci
    #  --reservation=ci
    SCHEDULER_PARAMETERS: -N 1 -t 30:00 -L none@slurmdb -A lanl_ai --partition=standard
    # -L none@slurmdb -A asc-ci --partition=ci --qos=ci --reservation=ci
    # CI_DEBUG_TRACE: "true"

#--------------------------------------------------------------------------------------------------#
# Merge Requests
#--------------------------------------------------------------------------------------------------#

.ve_merge:
  extends: .ve
  allow_failure: true
  script:
    - module swap PrgEnv-cray PrgEnv-gnu
    - /bin/bash -l -c "${CI_PROJECT_DIR}/.gitlab/ci/gitlab-ci-run-tests.sh"
  rules:
    - if: '$CI_MERGE_REQUEST_LABELS =~ /exclude_venado/'
      when: never
    - if: '$CI_MERGE_REQUEST_TITLE =~ /Draft:/ || $CI_MERGE_REQUEST_TITLE =~ /WIP:/'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "pipeline"'

# ----- fast -----

ve_deb_gnu_mr:
  stage: fasttest
  extends: .ve_merge
  variables:
    CMAKE_BUILD_TYPE: Debug
    DRACO_ENV: "lapse/2.6.0-gnu"

#--------------------------------------------------------------------------------------------------#
# Nightly Regression
#--------------------------------------------------------------------------------------------------#

.ve_nightly:
  extends: .ve
  stage: test
  variables:
    CTEST_MODE: Nightly
    CTEST_BUILD_NAME: ${DRACO_ENV}-${CMAKE_BUILD_TYPE}
  script:
    - module swap PrgEnv-cray PrgEnv-gnu
    - /bin/bash -l "${CI_PROJECT_DIR}/.gitlab/ci/gitlab-nightly-regress.sh" -m
      "Configure,Build,Test"
  after_script:
    - /bin/bash -l "${CI_PROJECT_DIR}/.gitlab/ci/gitlab-nightly-regress.sh" -m "Submit"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'

ve_deb_gnu_regress:
  extends: .ve_nightly
  variables:
    CMAKE_BUILD_TYPE: Debug
    DRACO_ENV: "lapse/2.6.0-gnu"

#--------------------------------------------------------------------------------------------------#
# end .gitlab/ci/ro-jobs.yml
#--------------------------------------------------------------------------------------------------#
