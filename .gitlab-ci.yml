#--------------------------------------------------------------------------------------------------#

variables:
  PROJECT: Draco
  DRACO_BINARY_DIR: ${CI_PROJECT_DIR}/build
  DRACO_SOURCE_DIR: ${CI_PROJECT_DIR}
  OMP_NUM_THREADS: 8
  CTEST_MODE: Experimental
  DEPLOY: "FALSE"

.jacamar:
  id_tokens:
    SITE_ID_TOKEN:
      aud: https://re-git.lanl.gov

stages:
  - fasttest
  - lint
  - test
  - slowtest
  - optional
  - metrics
  - deploy
  - deploy-downstream

include:
  - local: /.gitlab/ci/charm-jobs.yml
  - local: /.gitlab/ci/ccscs-jobs.yml
  - local: /.gitlab/ci/darwin-jobs.yml
  - local: /.gitlab/ci/ro-jobs.yml
  - local: /.gitlab/ci/rzadams-jobs.yml

#--------------------------------------------------------------------------------------------------#
# End .gitlab-ci.yml
#--------------------------------------------------------------------------------------------------#
